name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Test Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run Go Tests & Benchmarks
        run: |
          go test -v ./...
          go test -bench=. -benchmem ./pkg/charts

  test-node:
    name: Test Node Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Go CLI
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o bin/frr-cli ./cmd/frr-cli

      - name: Install Node dependencies
        working-directory: ./nodejs-wrapper
        run: npm ci || npm install

      - name: Build TypeScript
        working-directory: ./nodejs-wrapper
        run: npm run build

      - name: Smoke test
        working-directory: ./nodejs-wrapper
        env:
          FRR_BIN: ../bin/frr-cli
        run: node test-smoke.js
